# BAND APP – TESTOVACÍ TURN worker (Cloudflare Workers Free). TAJEMSTVÍ SEM NEPATŘÍ.
# TURN_USERNAME a TURN_PASSWORD se zadávají jen v Cloudflare (Dashboard → Variables and Secrets → typ Secret,
# nebo `npx wrangler secret put TURN_USERNAME`). Repozitář je veřejný.
name = "bandapp-turn-test"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
# Žádné logy požadavků (nic se neukládá).
[observability]
enabled = false

[vars]
TURN_MODE = "static"                       # ExpressTURN Free; "cloudflare" = Realtime TURN (placené, vypnuto)
TURN_URLS = "turn:free.expressturn.com:3478?transport=udp,turn:free.expressturn.com:3478?transport=tcp"
FIREBASE_PROJECT_ID = "band-app-test-9fc3e" # testovací projekt; produkční worker (později, zvlášť) = band-app-7c9ca
ALLOWED_ORIGIN = "https://holub5305-dotcom.github.io"
TTL_SECONDS = "14400"
RATE_PER_10MIN = "30"

# Produkční worker se nasadí až po schválení jako samostatný worker „bandapp-turn“ (vlastní tajemství):
# [env.prod]
# name = "bandapp-turn"
# vars = { ..., FIREBASE_PROJECT_ID = "band-app-7c9ca" }
